name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  SWA_NAME: hundredandten-web

jobs:
  build_and_deploy_job:
    # Skip closed PRs (handled below), forks and Dependabot (no OIDC token / vars).
    if: >-
      github.event_name == 'push' ||
      (github.event.action != 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: 'Az CLI Login via OIDC'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get SWA Token
        id: swa_token
        uses: azure/CLI@v3
        with:
          inlineScript: |
            TOKEN=$(az staticwebapp secrets list \
              -n $SWA_NAME \
              --query properties.apiKey \
              -o tsv)
            echo "token=$TOKEN" >> $GITHUB_OUTPUT
      
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for GitHub integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "." # App source code path relative to repository root - optional
          output_location: "dist" # Built app content directory, relative to app_location - optional
          ###### End of Repository/Build Configurations ######

      - name: Authenticate to Google Cloud
        if: github.event_name == 'pull_request'
        id: gcp_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Authorize preview domain in Firebase
        if: github.event_name == 'pull_request'
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          PREVIEW_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
        run: |
          host="${PREVIEW_URL#https://}"
          host="${host%%/*}"
          .github/scripts/firebase-domain.sh add "$host"

  close_pull_request_job:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: 'Az CLI Login via OIDC'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get SWA Token
        id: swa_token
        uses: azure/CLI@v3
        with:
          inlineScript: |
            TOKEN=$(az staticwebapp secrets list \
              -n $SWA_NAME \
              --query properties.apiKey \
              -o tsv)
            echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Find preview hostname
        id: preview
        uses: azure/CLI@v3
        with:
          inlineScript: |
            HOST=$(az staticwebapp environment list \
              -n $SWA_NAME \
              --query "[?buildId=='${{ github.event.pull_request.number }}'].hostname | [0]" \
              -o tsv)
            echo "host=$HOST" >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        if: steps.preview.outputs.host != ''
        id: gcp_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Remove preview domain from Firebase
        if: steps.preview.outputs.host != ''
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          PREVIEW_HOST: ${{ steps.preview.outputs.host }}
        run: .github/scripts/firebase-domain.sh remove "$PREVIEW_HOST"

      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          action: "close"
